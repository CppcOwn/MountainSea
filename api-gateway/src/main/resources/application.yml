spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: scenic-service
          uri: lb://scenic-service
          predicates:
            - Path=/api/scenic-spots/**
          filters:
            - JwtAuthentication
        - id: weather-service
          uri: lb://weather-service
          predicates:
            - Path=/api/weather/**
          filters:
            - JwtAuthentication
        - id: common-service
          uri: lb://common-service
          predicates:
            - Path=/api/regions/**,/api/scenic-levels/**,/api/stats/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/