input {
  tcp {
    port => 5044
    codec => json_lines
  }
  file {
    path => "/var/log/spring/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
    }
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "spring-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}